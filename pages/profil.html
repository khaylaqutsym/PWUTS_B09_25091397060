
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - SmartFinder</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="header">
    <div class="brand">
        <img src="../assets/logo-smartfinder.png" alt="Logo SmartFinder" class="logo">
        <div class="brand-text">
            <h1>Profil Saya</h1>
            <p>Kenali dirimu sebagai partner belajar.</p>
        </div>
    </div>
</header>

<main class="container">
    <a href="../index.html" class="feature-link">← Kembali ke Beranda</a>

    <section class="section-heading">
        <h2>Informasi Mahasiswa</h2>
        <p>Isi data dirimu dengan lengkap.</p>
    </section>

    <form id="profilForm" class="feature-card">
        <label for="nama">Nama lengkap</label>
        <input type="text" id="nama" name="nama" required>

        <label for="kampus">Universitas</label>
        <input type="text" id="kampus" name="kampus" required>

        <label for="prodi">Program studi</label>
        <input type="text" id="prodi" name="prodi" required>

        <label for="semester">Semester</label>
        <select id="semester" name="semester" required>
            <option value="">Pilih semester</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
        </select>

        <button type="submit" class="submit-btn">Simpan Profil</button>
        <p id="profilMessage" role="status"></p>
    </form>

    <section class="feature-card" style="margin-top: 24px;">
        <h2>Profil Tersimpan</h2>
        <p><strong>Nama:</strong> <span id="lihatNama">-</span></p>
        <p><strong>Universitas:</strong> <span id="lihatKampus">-</span></p>
        <p><strong>Program Studi:</strong> <span id="lihatProdi">-</span></p>
        <p><strong>Semester:</strong> <span id="lihatSemester">-</span></p>
    </section>
</main>

<script src="../script.js"></script>
</body>
</html>
